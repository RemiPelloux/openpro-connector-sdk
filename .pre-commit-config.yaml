# Quality hooks (https://pre-commit.com), run on staged files only.
# Runs from .husky/pre-commit (+ .husky/pre-push); enable with scripts/setup-hooks.sh or OpenOS scripts/dev/install-hooks.sh.
# Run everything: pre-commit run --all-files   Skip one hook: SKIP=<id> git commit
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"
exclude: '(^|/)(node_modules|vendor|dist|build|target|\.venv)/|\.min\.(js|css)$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        # --unsafe: syntax-only, so compose anchors and custom tags parse.
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
        exclude: '(^|/)(tsconfig[^/]*|\.vscode/[^/]*|\.devcontainer/[^/]*)\.json$'
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # warning+ only: catch real bugs without enforcing style on legacy scripts.
        args: [--severity=warning]
